    <script>
      // Suppress harmless Vite HMR WebSocket messages in AI Studio preview iframe
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (
            (args[0] === '[vite]' && typeof args[1] === 'string' && args[1].includes('WebSocket')) ||
            (typeof args[0] === 'string' && args[0].includes('WebSocket error'))
          ) {
            return;
          }
          origError.apply(console, args);
        };
      })();
    </script>
